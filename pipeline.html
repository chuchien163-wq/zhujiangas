<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工程管線管理系統｜竹建瓦斯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#1c2733; --sub:#5b6b7c; --line:#d6dee7;
  --brand:#1d4e89; --brand2:#2f6db5; --brand-soft:#e3edf9;
  --new:#1f6fd1; --new-soft:#e1edfc; --rep:#d96b0b; --rep-soft:#fdebd9;
  --ok:#1e8a4c; --ok-soft:#dff3e7; --warn:#b7791f; --warn-soft:#fdf3d8; --bad:#c53030; --bad-soft:#fde2e2;
  --shadow:0 1px 3px rgba(20,40,70,.08),0 4px 14px rgba(20,40,70,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.55;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--brand);color:#fff;flex-wrap:wrap}
header h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.5px}
header .ver{font-size:13px;opacity:.75}
.period{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;font-size:16px}
.period select{background:#fff;color:var(--ink);border:0;border-radius:6px;padding:4px 8px}
.hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.28)}
.main{flex:1;display:flex;min-height:0}
nav{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:12px 14px;margin-bottom:4px;cursor:pointer;font-size:17px;color:var(--ink)}
nav button:hover{background:var(--brand-soft)}
nav button.on{background:var(--brand);color:#fff;font-weight:700}
nav .ico{width:24px;text-align:center}
nav .foot{margin-top:18px;padding:10px 12px;font-size:14px;color:var(--sub);border-top:1px solid var(--line)}
#content{flex:1;overflow-y:auto;padding:18px 22px 40px;min-width:0}
h2.pg{margin:0 0 14px;font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.pg .sp{flex:1}
.card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;border-top:5px solid var(--brand)}
.kpi.new{border-top-color:var(--new)} .kpi.rep{border-top-color:var(--rep)} .kpi.ok{border-top-color:var(--ok)}
.kpi .lb{font-size:15px;color:var(--sub)}
.kpi.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi.click:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(20,40,70,.16)}
.kpi .go{float:right;font-size:14px;color:var(--brand2)}
.kpi .d a,.bars a{color:inherit;text-decoration:underline dotted;cursor:pointer}
.kpi .d a:hover,.bars a:hover{color:var(--brand2)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.2}
.kpi .v small{font-size:16px;font-weight:500;color:var(--sub);margin-left:4px}
.kpi .d{font-size:15px;color:var(--sub);margin-top:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.b-new{background:var(--new-soft);color:var(--new)} .b-rep{background:var(--rep-soft);color:var(--rep)}
.b-st{background:#eef1f5;color:#44505c} .b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand2)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand2)}
.btn.danger{color:var(--bad);border-color:#f0b4b4}
.btn.sm{padding:3px 10px;font-size:15px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.tab .n{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.08);font-size:14px;text-align:center}
.tab.on .n{background:rgba(255,255,255,.25)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer}
.chip.on.c-all{background:#44505c;color:#fff;border-color:#44505c}
.chip.on.c-new{background:var(--new);color:#fff;border-color:var(--new)}
.chip.on.c-rep{background:var(--rep);color:#fff;border-color:var(--rep)}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:15.5px}
table.t th{background:#f3f6fa;color:#34414e;text-align:left;font-weight:700;padding:8px 9px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.t th.sortable{cursor:pointer}
table.t th.sortable:hover{color:var(--brand2)}
table.t td{padding:8px 9px;border-bottom:1px solid #e8edf2;vertical-align:top}
table.t tr.row:hover td{background:#f7faff;cursor:pointer}
table.t td.nw{white-space:nowrap}
table.t td.act{text-align:right;width:1%}
table.t td.act .btn{display:block;width:100%;margin:0 0 4px}
table.t td{word-break:break-word}
@media (max-width:1350px){table.t{font-size:15px}table.t th,table.t td{padding:7px 6px}}
@media (min-width:761px) and (max-width:1250px){table.t [data-k="完工日"],table.t [data-k="狀態"]{display:none}}
@media (min-width:761px) and (max-width:1500px){table.t [data-k="預計工期"],table.t [data-k="已施工天數"],table.t [data-k="會勘日期"],table.t [data-k="備註"],table.t [data-k="繳費日"]{display:none}}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.sub td{background:#f6f8fb;font-weight:700}
table.t tr.tot td{background:#e9eef5;font-weight:700}
.sec-h{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-size:18px;font-weight:700}
.sec-h:first-child{margin-top:0}
.sec-h .bar{width:6px;height:22px;border-radius:3px}
.sec-h .meta{font-size:15px;color:var(--sub);font-weight:500}
.red{color:var(--bad);font-weight:700}
.muted{color:var(--sub)}
.empty{padding:22px;text-align:center;color:var(--sub)}
.bars .r{margin:12px 0;font-size:16px}
.bars .bh{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px;font-weight:700}
.bars .track{height:18px;background:#edf1f6;border-radius:9px;overflow:hidden;display:flex}
.bars .seg.click{cursor:pointer;transition:filter .12s}
.bars .seg.click:hover{filter:brightness(1.18)}
.bars .bsub{font-size:14.5px;margin-top:3px}
.bars .bsub a{text-decoration:underline dotted;cursor:pointer;font-weight:700}
.bars .bsub a.cn{color:var(--new)} .bars .bsub a.cr{color:var(--rep)}

.bars .seg{height:100%}
.legend{display:flex;gap:16px;font-size:14.5px;color:var(--sub);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.todo{display:inline-block;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:0 6px;margin:1px 3px 1px 0;font-size:13.5px;font-weight:700;white-space:nowrap}
.tv{display:inline-block;border-radius:6px;padding:1px 7px;font-size:14px;white-space:nowrap}
.tv-ok{background:var(--ok-soft);color:var(--ok)} .tv-bad{background:var(--bad-soft);color:var(--bad);font-weight:700} .tv-na{background:#eef1f5;color:#6b7785} .tv-empty{color:#b0bac5}
.tsel{border:1px solid var(--line);border-radius:7px;padding:2px 2px;font-size:14px;background:#fff;max-width:100%}
@media (min-width:761px) and (max-width:1450px){table.ttrack [data-k="狀態"],table.ttrack [data-k="結算"],table.ttrack [data-k="備註"]{display:none}table.ttrack th,table.ttrack td{padding:6px 3px}table.ttrack .tsel{font-size:13.5px}table.ttrack th{font-size:14px;white-space:normal}}
.tsel.tv-bad{border-color:#f0b4b4} .tsel.tv-ok{border-color:#a8dcbc}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:12px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tcard .tt{font-weight:700;font-size:15.5px;margin-bottom:5px}
.tch{display:flex;flex-wrap:wrap;gap:5px}
.tchip{border:1px solid transparent;border-radius:8px;padding:3px 9px;font-size:14.5px;cursor:pointer;font-family:inherit}
.tchip b{font-size:15.5px;margin-left:2px}
.tchip.on{outline:3px solid var(--brand2);outline-offset:1px}
.tchip.dim{opacity:.45}
.tchip.tv-empty{background:#fff;border-color:#d6dee7;color:#7b8794}
.tsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tsum button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:15.5px}
.tsum button b{font-size:20px;color:var(--bad);margin-right:6px}
.tsum button.on{outline:3px solid var(--brand2)}
.tsum button.zero b{color:var(--ok)}
#pendBar{display:none}
#pendBar.show{display:block;position:sticky;bottom:0;background:#fff7d6;border:2px solid #f0c36d;border-radius:12px;padding:10px 14px;margin-top:12px;box-shadow:0 -4px 14px rgba(0,0,0,.08);z-index:5}
#pendBar .pbtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#pendBar .sp{flex:1}
#pendBar .pbdet{max-height:34vh;overflow:auto;margin-top:8px;background:#fff;border-radius:8px}
#pendBar table.chgt td,#pendBar table.chgt th{padding:4px 8px}
.tsel.chg{background:#fff3b8!important;border:2px solid #e0a800!important;font-weight:700}
.chgwrap{max-height:50vh;overflow:auto;margin-top:8px}
table.chgt{font-size:15px}
table.chgt td,table.chgt th{padding:5px 7px}
.modal.small{width:min(620px,100%)}
table.mgr{border-collapse:collapse;width:100%;font-size:15.5px;font-family:"DFKai-SB","BiauKai","標楷體","Noto Sans TC",serif}
table.mgr th{background:#ffff00;border:1px solid #888;padding:6px 5px;white-space:nowrap}
table.mgr td{border:1px solid #bbb;padding:5px 6px}
table.mgr td.c{text-align:center}
table.mgr td.vt{text-align:center;font-weight:700;writing-mode:vertical-lr;letter-spacing:4px;background:#fafafa}
table.mgr td.vd{writing-mode:horizontal-tb;letter-spacing:0}
table.mgr tr.xc td:not(.vt){color:#0070c0}
table.mgr tr.xc td.vd{color:#0070c0}
table.mgr tr.sub td{background:#f2f2f2;font-weight:700}
.mgrf>div{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:4px 0}
.mgrf b{min-width:44px}
label.ck{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
label.ck input{width:18px;height:18px}
.mtr{font-size:14px;white-space:nowrap}
.mtr.owe b{color:var(--bad)} .mtr.ok{color:var(--ok)}
.mtr-s{font-size:12.5px;color:var(--sub);margin-top:2px}
button.mini{display:block;margin-top:3px;border:1px solid #8fd1a9;background:var(--ok-soft);color:var(--ok);border-radius:6px;font-size:12.5px;padding:1px 6px;cursor:pointer;white-space:nowrap}
.mbox{margin-top:12px;background:#f3f0ff;border:1px solid #d9d0ff;border-radius:10px;padding:10px 12px;font-size:15.5px;line-height:1.7}
.issues li{margin:8px 0}
a.lnk{color:var(--brand2);cursor:pointer;text-decoration:underline dotted}
table.ttrack td{vertical-align:middle}
.issues li span{cursor:pointer}
.issues li span:hover{color:var(--brand2);text-decoration:underline}
.issues li .btn{margin-left:6px;vertical-align:1px}
/* report preview */
.paper{background:#fff;max-width:900px;margin:0 auto;padding:30px 36px;box-shadow:var(--shadow);border-radius:6px;font-family:"DFKai-SB","BiauKai","標楷體","Noto Sans TC",serif;font-size:16px}
.paper h2{font-size:20px;margin:0 0 12px}
.paper h3{font-size:18px;margin:18px 0 8px}
.paper h4{font-size:16.5px;margin:10px 0 6px}
.paper table{border-collapse:collapse;width:100%;margin-bottom:8px}
.paper th,.paper td{border:1px solid #333;padding:4px 6px;text-align:center;font-size:15px}
.paper td.l{text-align:left}
.paper .unit{text-align:right;font-size:14px;margin:0 0 3px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,25,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:0 12px}
.mask .modal{margin:30px 0}
.mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:min(980px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.small{width:min(440px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:19px;font-weight:700}
.modal .mb{padding:16px 20px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:#fff;border-radius:0 0 14px 14px;z-index:2}
.modal .mh{position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;z-index:2}
.pwline{display:flex;align-items:center;gap:8px;font-size:15.5px;color:var(--warn)}
.pwline input{width:130px;border:2px solid #f0c36d;border-radius:8px;padding:6px 10px}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 2}
.f.w3{grid-column:span 3} .f.w6{grid-column:span 6} .f.w1{grid-column:span 1}
.f label{font-size:15px;color:var(--sub);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--brand2);border-color:transparent}
.seg2{display:flex;gap:8px}
.seg2 label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;cursor:pointer;color:var(--ink);font-size:16px}
.seg2 input{display:none}
.seg2 label.on-new{background:var(--new);color:#fff;border-color:var(--new)}
.seg2 label.on-rep{background:var(--rep);color:#fff;border-color:var(--rep)}
.seg2 label.on-gen{background:var(--brand);color:#fff;border-color:var(--brand)}
.hint{font-size:14.5px;color:var(--sub)}
.hint.warn{color:var(--warn)}
.ptable{width:100%;border-collapse:collapse;font-size:15.5px}
.ptable th{font-size:14.5px;color:var(--sub);text-align:left;padding:4px 6px}
.ptable td{padding:4px 6px}
.ptable input,.ptable select{border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;background:#fff}
.req{color:var(--bad)}
/* loading */
#loading{position:fixed;inset:0;background:rgba(20,35,55,.42);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
#loading.show{display:flex}
.ldcard{background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:26px 30px;width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
#loadingMsg{font-size:19px;font-weight:700}
.ldbar{width:100%;height:10px;background:#e3eaf3;border-radius:5px;overflow:hidden}
.ldbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:5px}
#ldTime{font-size:15px;color:var(--sub)}
#ldSlow{font-size:15px;color:var(--warn);display:none}
#topbar{position:fixed;top:0;left:0;height:4px;width:0;background:#f6b93b;z-index:85;transition:width .3s}
.spin{width:52px;height:52px;border-radius:50%;border:5px solid #c9d6e6;border-top-color:var(--brand);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#tourMask{position:fixed;inset:0;z-index:95;display:none}
#tourHole{position:fixed;z-index:96;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,20,35,.62);outline:3px solid #ffd54a;transition:all .25s;display:none;pointer-events:none}
#tourTip{position:fixed;z-index:97;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);width:min(400px,calc(100vw - 24px));padding:16px 18px;display:none}
#tourTip h4{margin:0 0 6px;font-size:18px}
#tourTip p{margin:0 0 12px;font-size:16px;line-height:1.6}
#tourTip .tf{display:flex;align-items:center;gap:8px}
#tourTip .tf .n{flex:1;color:var(--sub);font-size:14px}
#tourTip .dots{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
#tourTip .dots i{width:8px;height:8px;border-radius:50%;background:#d6dee7}
#tourTip .dots i.on{background:var(--brand2)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#22303d;color:#fff;padding:10px 20px;border-radius:10px;z-index:90;display:none;font-size:16px;max-width:90vw}
#toast.show{display:block}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.setup{max-width:720px;margin:30px auto}
.setup input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0 12px}
.lockpill{font-size:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:760px){
  body{font-size:16.5px}
  header{padding:8px 12px;gap:8px}
  header h1{font-size:18px}
  .period{margin-left:0;width:100%}
  .main{flex-direction:column}
  nav{width:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;flex:none}
  nav button{width:auto;flex:none;padding:8px 12px;margin:0;font-size:16px}
  nav .foot{display:none}
  #content{padding:12px 12px 40px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .v{font-size:24px}
  .form{grid-template-columns:1fr 1fr}
  .f,.f.w3,.f.w6{grid-column:span 2}
  .f.w1{grid-column:span 1}
  table.t.cardify thead{display:none}
  table.t.cardify,table.t.cardify tbody,table.t.cardify tr,table.t.cardify td{display:block;width:100%}
  table.t.cardify tr{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 10px}
  table.t.cardify td{border:0;padding:3px 0;display:flex;gap:10px;text-align:left!important}
  table.t.cardify td::before{content:attr(data-l);flex:none;width:86px;color:var(--sub);font-size:14.5px}
  table.t.cardify td[data-l=""]::before{display:none}
  table.t.cardify tr.sub,table.t.cardify tr.tot{background:#f2f5f9}
  .paper{padding:16px 12px}
  .ptable thead{display:none}
  .ptable,.ptable tbody,.ptable tr,.ptable td{display:block;width:100%}
  .ptable tr{border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:8px}
  .ptable td::before{content:attr(data-l);display:block;font-size:13.5px;color:var(--sub)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🔧 工程管線管理系統</h1><span class="ver">竹建瓦斯｜v2.5</span>
    <div class="period">
      <span>統計期間</span>

<script>
"use strict";
/* ====== 設定：部署 GAS 後把 /exec 網址貼在這裡 ====== */
var API_URL = "https://script.google.com/macros/s/AKfycbzH46DNlo1DatqaOw0vYq-Pl6eeCtc5tJgZuu4ftqthOh6f-QoyoqUSgLVgp0whLDDS/exec";
var LS_API = "pipeline_api_v1", LS_UI = "pipeline_ui_v1", SS_PW = "pipeline_pw_v1";
var TIMEOUT_MS = 25000;

var STATUS = ["待施工", "施工中", "待掛表", "完工待驗收", "已竣工"];
var ACTIVE = ["待施工", "施工中", "待掛表", "完工待驗收"];
var PIPE_TYPES = ["110mm PE管", "63mm PE管", "160mm PE管", "200mm PE管", "6\" PE被覆無縫鋼管", "4\" PE被覆無縫鋼管"];
var RM_TYPES = ["2\" PVC管", "3\" PVC管", "4\" PVC管", "2\" 鋼管", "3\" 鋼管"];

var DB = { cases: [], pipes: [], leaks: [], params: {}, logs: [] };
var PB = {};
var UI = { page: "dash", y: 0, m1: 1, m2: 12, st: "進行中", cls: "全部", q: "", sortK: "", sortD: 1 };
var PW = "";

/* ---------- 工具 ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
function num(v) { var n = parseFloat(String(v).replace(/,/g, "")); return isFinite(n) ? n : 0; }
function fmt(n) { n = Math.round(num(n) * 100) / 100; return n.toLocaleString("en-US"); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function ssSet(k, v) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
function isISO(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s)); }
function normDate(s) {
  s = String(s || "").trim();
  var m = s.match(/^(\d{2,3})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/);
  if (m) return (parseInt(m[1], 10) + 1911) + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2);
  m = s.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
  if (m) return m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2);
  return s;
}
function roc(s) {
  if (!isISO(s)) return s || "";
  var p = s.split("-");
  return (parseInt(p[0], 10) - 1911) + "/" + p[1] + "/" + p[2];
}
function rocYearNow() { return new Date().getFullYear() - 1911; }
function classByCode(code) { return /^\d{6}[EF]/i.test(String(code || "").trim()) ? "汰換" : "新設"; }
function inPeriod(iso, y, m1, m2) {
  if (!isISO(iso)) return false;
  var yy = parseInt(iso.slice(0, 4), 10) - 1911, mm = parseInt(iso.slice(5, 7), 10);
  return yy === y && mm >= m1 && mm <= m2;
}
function toast(msg, ms) {
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, ms || 2600);
}
function apiUrl() {
  if (API_URL && API_URL.indexOf("PASTE_") !== 0) return API_URL;
  return lsGet(LS_API) || "";
}
var loadingCount = 0, loadingWatch = null, ldTick = null, ldStart = 0, SLOW_MS = 8000;
function ldPaint() {
  var sec = Math.floor((Date.now() - ldStart) / 1000);
  $("#ldTime").textContent = "已經過 " + sec + " 秒";
  var pct = Math.min(92, 92 * (1 - Math.exp(-(Date.now() - ldStart) / 4000)));
  $("#ldFill").style.width = pct.toFixed(1) + "%";
  $("#topbar").style.width = pct.toFixed(1) + "%";
  $("#ldSlow").style.display = (Date.now() - ldStart) >= SLOW_MS ? "block" : "none";
}
function showLoading(msg) {
  loadingCount++;
  $("#loadingMsg").textContent = msg || "讀取中…";
  if (loadingCount === 1) {
    ldStart = Date.now();
    clearInterval(ldTick); ldTick = setInterval(ldPaint, 250);
  }
  ldPaint();
  $("#loading").classList.add("show");
  clearTimeout(loadingWatch);
  loadingWatch = setTimeout(function () { loadingCount = 1; hideLoading(); }, TIMEOUT_MS + 3000);
}
function hideLoading() {
  loadingCount = Math.max(0, loadingCount - 1);
  if (loadingCount) return;
  clearTimeout(loadingWatch); clearInterval(ldTick); ldTick = null;
  $("#ldFill").style.width = "100%"; $("#topbar").style.width = "100%";
  $("#loading").classList.remove("show");
  setTimeout(function () { if (!loadingCount) { $("#topbar").style.width = "0"; $("#ldFill").style.width = "0"; } }, 350);
}

/* ---------- API（含逾時看門狗） ---------- */
function req(method, payload) {
  var url = apiUrl();
  if (!url) return Promise.reject(new Error("尚未設定後端網址"));
  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer;
  var timeout = new Promise(function (_, rej) {
    timer = setTimeout(function () { if (ctrl) ctrl.abort(); rej(new Error("連線逾時（超過 " + (TIMEOUT_MS / 1000) + " 秒），請按「🔄 更新」重試")); }, TIMEOUT_MS);
  });
  var opt = { method: method, redirect: "follow" };
  if (ctrl) opt.signal = ctrl.signal;
  var full = url;
  if (method === "GET") full = url + (url.indexOf("?") > -1 ? "&" : "?") + "action=getAll&t=" + Date.now();
  else opt.body = JSON.stringify(payload);
  var f = fetch(full, opt).then(function (r) {
    if (!r.ok) throw new Error("後端回應錯誤 HTTP " + r.status);
    return r.text();
  }).then(function (t) {
    var j;
    try { j = JSON.parse(t); } catch (e) { throw new Error("後端回傳的不是資料（請確認部署權限為「任何人」、網址是 /exec 結尾）"); }
    return j;
  });
  return Promise.race([f, timeout]).then(function (j) { clearTimeout(timer); return j; }, function (e) {
    clearTimeout(timer);
    if (e && e.name === "AbortError") throw new Error("連線逾時，請按「🔄 更新」重試");
    if (e && /Failed to fetch|NetworkError|Load failed/i.test(e.message)) throw new Error("連不到後端（網路中斷或網址錯誤）");
    throw e;
  });
}
function setData(d) {
  DB.cases = d.cases || []; DB.pipes = d.pipes || []; DB.leaks = d.leaks || []; DB.params = d.params || {}; DB.logs = d.logs || []; DB.mmap = d.mmap || []; DB.meter = d.meter || null;
  PB = {};
  DB.pipes.forEach(function (p) { (PB[p["案件UID"]] = PB[p["案件UID"]] || []).push(p); });
  $("#navFoot").innerHTML = "案件 " + DB.cases.length + " 筆<br>讀取於 " + new Date().toLocaleTimeString("zh-TW", { hour12: false });
}
function load() {
  if (!apiUrl()) { renderSetup(); return Promise.resolve(); }
  showLoading("讀取雲端資料中…");
  return req("GET").then(function (d) {
    hideLoading();
    if (!d.ok) throw new Error(d.msg || "讀取失敗");
    setData(d); fillPeriod(); render();
    if (!lsGet(TOUR_KEY)) setTimeout(startTour, 400);
  }).catch(function (e) {
    hideLoading();
    $("#content").innerHTML = '<div class="errbox">⚠ ' + esc(e.message) + '</div><button class="btn pri" onclick="load()">重試</button> <button class="btn" onclick="renderSetup(true)">重新設定後端網址</button>';
  });
}
function post(action, data, okMsg) {
  showLoading("存檔中…");
  var payload = Object.assign({ action: action, pw: PW }, data || {});
  return req("POST", payload).then(function (j) {
    hideLoading();
    if (!j.ok) {
      if (/密碼/.test(j.msg || "")) { PW = ""; lsSet(SS_PW, ""); updLock(); }
      toast("❌ " + (j.msg || "存檔失敗"), 4000); return false;
    }
    if (j.data) setData(j.data);
    toast(okMsg || "✅ 已存檔"); render(); return true;
  }).catch(function (e) { hideLoading(); toast("❌ " + e.message, 4500); return false; });
}

/* ---------- 期間 ---------- */
function fillPeriod() {
  var ys = {}; ys[rocYearNow()] = 1;
  DB.cases.forEach(function (c) { if (isISO(c["完工日"])) ys[parseInt(c["完工日"].slice(0, 4), 10) - 1911] = 1; });
  DB.leaks.forEach(function (l) { if (isISO(l["日期"])) ys[parseInt(l["日期"].slice(0, 4), 10) - 1911] = 1; });
  var list = Object.keys(ys).map(Number).sort(function (a, b) { return b - a; });
  if (list.indexOf(UI.y) < 0) UI.y = list[0];
  $("#pY").innerHTML = list.map(function (y) { return '<option value="' + y + '"' + (y === UI.y ? " selected" : "") + ">" + y + "</option>"; }).join("");
  var mo = function (sel) { var h = ""; for (var i = 1; i <= 12; i++) h += '<option value="' + i + '"' + (i === sel ? " selected" : "") + ">" + i + "</option>"; return h; };
  $("#pM1").innerHTML = mo(UI.m1); $("#pM2").innerHTML = mo(UI.m2);
}
function periodText() { return UI.y + "年" + (UI.m1 === UI.m2 ? UI.m1 + "月" : UI.m1 + "-" + UI.m2 + "月"); }
function saveUI() { lsSet(LS_UI, JSON.stringify({ page: UI.page, y: UI.y, m1: UI.m1, m2: UI.m2, st: UI.st, cls: UI.cls, drill: UI.drill || {} })); }

/* ---------- 計算核心 ---------- */
function caseByUid(u) { for (var i = 0; i < DB.cases.length; i++) if (DB.cases[i].UID === u) return DB.cases[i]; return null; }
function pipesOf(c) { return PB[c.UID] || []; }
function caseLen(c) { return pipesOf(c).reduce(function (s, p) { return s + num(p["敷設長度"]); }, 0); }
// 工程編號第 7 碼 R＝個別戶，不列入董監事會統計
function isIndiv(c) { return /^\d{6}R/i.test(String(c["工程編號"] || "")); }
function doneInPeriod(y, m1, m2) {
  return DB.cases.filter(function (c) { return c["狀態"] === "已竣工" && !isIndiv(c) && inPeriod(c["完工日"], y, m1, m2); });
}
function sortDone(list) {
  return list.slice().sort(function (a, b) { return String(a["完工日"]).localeCompare(String(b["完工日"])) || String(a.UID).localeCompare(String(b.UID)); });
}
function pipeKey(t) {
  t = String(t || "").replace(/\s+/g, " ").trim();
  var size = (t.match(/^\s*([\d.]+\s*(mm|"|吋|”))/i) || [])[1] || "";
  size = size.replace(/\s/g, "").replace(/”|吋/, "\"");
  var rest = t.replace(/^\s*[\d.]+\s*(mm|"|吋|”)/i, "").replace(/\s+/g, "").trim();
  var grp = /被覆/.test(rest) ? "PE被覆無縫鋼管" : (/^PE管?$/i.test(rest) ? "PE管" : (rest || "其他"));
  return { grp: grp, size: size || "－" };
}
function sizeNum(s) { var n = parseFloat(s); if (/"/.test(s)) n = n * 25.4; return isFinite(n) ? n : 0; }
function statsFor(y, m1, m2) {
  var done = doneInPeriod(y, m1, m2);
  var cols = {}, rows = { "新設|中壓": {}, "新設|低壓": {}, "汰換|中壓": {}, "汰換|低壓": {} };
  done.forEach(function (c) {
    pipesOf(c).forEach(function (p) {
      var L = num(p["敷設長度"]); if (!L && !p["敷設管種"]) return;
      var k = pipeKey(p["敷設管種"]), ck = k.grp + "|" + k.size;
      cols[ck] = k;
      var rk = c["類別"] + "|" + (p["壓力"] === "中壓" ? "中壓" : "低壓");
      rows[rk][ck] = (rows[rk][ck] || 0) + L;
    });
  });
  var order = Object.keys(cols).sort(function (a, b) {
    var A = cols[a], B = cols[b];
    var ga = A.grp === "PE管" ? 0 : (A.grp === "PE被覆無縫鋼管" ? 1 : 2), gb = B.grp === "PE管" ? 0 : (B.grp === "PE被覆無縫鋼管" ? 1 : 2);
    if (ga !== gb) return ga - gb;
    if (A.grp !== B.grp) return A.grp.localeCompare(B.grp);
    return sizeNum(B.size) - sizeNum(A.size);
  });
  var sum = function (rk) { return order.reduce(function (s, ck) { return s + (rows[rk][ck] || 0); }, 0); };
  return {
    done: done, cols: cols, order: order, rows: rows,
    newMid: sum("新設|中壓"), newLow: sum("新設|低壓"), repMid: sum("汰換|中壓"), repLow: sum("汰換|低壓")
  };
}

/* ---------- 版面 ---------- */
function render() {
  $$("#nav button").forEach(function (b) { b.classList.toggle("on", b.dataset.p === (UI.page === "drill" ? "dash" : UI.page)); });
  var fn = { dash: renderDash, drill: renderDrill, prog: renderProg, track: renderTrack, mmap: renderMmap, rep: renderRep, leak: renderLeak, report: renderReport, log: renderLog, set: renderSet }[UI.page] || renderDash;
  fn(); saveUI();
}
function clsBadge(c) { return c === "汰換" ? '<span class="badge b-rep">汰換</span>' : '<span class="badge b-new">新設</span>'; }
function stBadge(s) {
  var m = { "已竣工": "b-ok", "完工待驗收": "b-warn", "施工中": "b-bad" };
  return '<span class="badge ' + (m[s] || "b-st") + '">' + esc(s || "未設定") + "</span>";
}

/* ===== 搜尋框：支援注音／倉頡等輸入法（選字完成才搜尋），並稍等 0.3 秒再重畫 ===== */
var searchTimer = null;
function bindSearch(id, key, renderFn) {
  var el = $("#" + id); if (!el) return;
  var composing = false;
  var go = function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      var cur = $("#" + id); if (!cur || composing) return;
      UI[key] = cur.value; var pos = cur.selectionStart;
      renderFn();
      var n = $("#" + id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    }, 300);
  };
  el.addEventListener("compositionstart", function () { composing = true; clearTimeout(searchTimer); });
  el.addEventListener("compositionend", function () { composing = false; go(); });
  el.addEventListener("input", function (e) { if (composing || e.isComposing) return; go(); });
}
/* ===== 總覽 ===== */
// 備註裡仍需處理的句子：已經自動解決的（編號已不重複、編號格式已正確）不再列出
function noteSegs(c, byCode) {
  return String(c["備註"] || "").split(/[；;]/).map(function (x) { return x.trim(); }).filter(function (seg) {
    if (!/待確認|待補|僅8碼/.test(seg)) return false;
    if (/工程編號與.*相同/.test(seg) && byCode[c["工程編號"]].length < 2) return false;
    if (/編號僅8碼/.test(seg) && /^\d{6}[A-Z]\d{3}$/.test(c["工程編號"])) return false;
    return true;
  });
}
function clearNote(uid) {
  var c = caseByUid(uid); if (!c) return;
  var byCode = {}; DB.cases.forEach(function (x) { (byCode[x["工程編號"]] = byCode[x["工程編號"]] || []).push(x); });
  confirmBox("把 <b>" + esc(c["工程編號"] + " " + c["工程名稱"]) + "</b> 備註裡的「待確認／待補」字句刪掉，標記為已處理？", "標記已處理", function () {
    needLogin(function () {
      var keep = String(c["備註"] || "").split(/[；;]/).map(function (x) { return x.trim(); }).filter(function (seg) { return seg && !/待確認|待補|僅8碼|工程編號與.*相同/.test(seg); });
      var it = Object.assign({}, c, { 備註: keep.join("；") });
      post("saveCase", { item: it, pipes: pipesOf(c).map(function (p) { return Object.assign({}, p); }) }, "✅ 已標記處理：" + c["工程編號"]);
    });
  });
}
function issuesList() {
  var out = [], byCode = {};
  DB.cases.forEach(function (c) { (byCode[c["工程編號"]] = byCode[c["工程編號"]] || []).push(c); });
  DB.cases.forEach(function (c) {
    var tag = c["工程編號"] + " " + c["工程名稱"];
    if (!String(c["工程編號"] || "").trim()) out.push([c.UID, "還沒有工程編號（拿到編號後點這裡補上）：" + c["工程名稱"]]);
    else if (!/^\d{6}[A-Z]\d{3}$/.test(c["工程編號"])) out.push([c.UID, "工程編號格式異常（應為 6 碼數字＋1 英文＋3 碼數字）：" + tag]);
    if (byCode[c["工程編號"]].length > 1 && byCode[c["工程編號"]].some(function (o) { return o["工程名稱"] !== c["工程名稱"]; })) out.push([c.UID, "工程編號重複（案名不同）：" + tag]);
    if (c["狀態"] === "已竣工" && !isIndiv(c) && !isISO(c["完工日"])) out.push([c.UID, "已竣工但沒有完工日（報告抓不到）：" + tag]);
    if (c["狀態"] === "已竣工" && !isIndiv(c) && !caseLen(c)) out.push([c.UID, "已竣工但沒有管線長度：" + tag]);
    var mt = meterFor(c);
    if (mt && mt.act > 0 && mt.owe <= 0 && c["掛表"] === "待掛表") out.push([c.UID, "換表系統顯示錶已領齊（" + mt.act + " 只），施工追蹤「掛表」還是待掛表：" + tag, "meter"]);
    if (c["類別"] === "汰換" && (!c["汰換性質"] || !c["計畫年度"])) out.push([c.UID, "汰換工程缺計畫性／計畫年度：" + tag]);
    if (c["狀態"] === "完工待驗收") out.push([c.UID, "完工待驗收（驗收後改『已竣工』並填完工日才會進報告）：" + tag]);
  });
  var nq = (DB.mmap || []).filter(function (m) { return m["確認"] === "?"; }).length;
  if (nq) out.push(["__mmap", "換表對照有 " + nq + " 筆待確認（點這裡到「🔗 換表對照」確認）", "mmap"]);
  if (DB.meter && DB.meter.ok === false) out.push(["__mmap", "⚠ " + (DB.meter.msg || "讀不到換表系統"), "mmap"]);
  var seen = {};
  return out.filter(function (x) { var k = x[0] + x[1]; if (seen[k]) return false; seen[k] = 1; return true; });
}
function dashSearch(q) {
  q = q.toLowerCase();
  var list = DB.cases.filter(function (c) {
    var hay = [c["工程編號"], c["工程名稱"], c["工程位置"], c["現況"], c["備註"], c["類別"], c["狀態"], c["汰換性質"]].concat(pipesOf(c).map(function (p) { return p["敷設管種"] + " " + p["廢除管種"]; })).join(" ").toLowerCase();
    return hay.indexOf(q) > -1;
